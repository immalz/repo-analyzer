# Material criptografico y credenciales embebidas en cualquier archivo de
# texto. El mensaje solo lleva el TIPO de hallazgo, nunca el valor (N3).
rules:
  - id: secret-private-key
    languages: [generic]
    severity: INFO
    message: "private-key"
    pattern-regex: -----BEGIN ((RSA|EC|DSA|OPENSSH|ENCRYPTED) )?PRIVATE KEY-----
    metadata: {fact: secret.hardcoded, fields: [name], source: file, criteria: [SEG.001, SEG.004, SEG.005]}

  - id: secret-aws-access-key
    languages: [generic]
    severity: INFO
    message: "aws-access-key-id"
    pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b
    metadata: {fact: secret.hardcoded, fields: [name], source: file, criteria: [SEG.002, SEG.004]}

  - id: secret-connection-string
    languages: [generic]
    severity: INFO
    message: "$KIND"
    pattern-regex: (?i)\b(?P<KIND>AccountKey|SharedAccessKey|SharedAccessSignature|Password|Pwd)=[^;"'\s${}]{4,}
    metadata: {fact: secret.hardcoded, fields: [name], source: key-value, criteria: [RTM.002, SEG.004]}

  - id: embedded-certificate
    languages: [generic]
    severity: INFO
    message: "certificate"
    pattern-regex: -----BEGIN CERTIFICATE-----
    metadata: {fact: security.certificate, fields: [kind], criteria: [SEG.006]}
