rules:
  - id: java-import
    languages:
      - java
    message: "Import statement detectado."
    severity: INFO
    pattern-regex: '^\s*import\s+[a-zA-Z0-9_.*]+;'

  - id: cloud-vendor-sdk-import
    languages:
      - java
    message: "SDK Vendor detectado."
    severity: INFO
    pattern-either:
      - pattern-regex: '^\s*import\s+(?:static\s+)?software\.amazon\.awssdk\..*;'
      - pattern-regex: '^\s*import\s+(?:static\s+)?com\.amazonaws\..*;'
      - pattern-regex: '^\s*import\s+(?:static\s+)?com\.google\.cloud\..*;'
      - pattern-regex: '^\s*import\s+(?:static\s+)?com\.azure\..*;'

  - id: java-interface-declaration
    languages:
      - java
    message: "Declaracion de interfaz."
    severity: INFO
    pattern: interface $X { ... }

  - id: java-class-implements
    languages:
      - java
    message: "Clase implementa interfaz."
    severity: INFO
    pattern: class $X implements $Y { ... }
