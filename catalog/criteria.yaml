criteria:
  ARQ.001:
    name: "Estilo Arquitectónico"
    confidence: 0.6

    metrics:
      - layer_violations
      - domain_violations
      - application_violations
      - ports_layer_present

    parameters:
      # Paquetes externos que el dominio puede importar sin contar como layer_violation.
      # Cualquier otro framework o SDK externo importado desde el dominio SI cuenta.
      # Propuesta inicial, a validar con el comite.
      domain_allowed_packages:
        - java
        - lombok

    scores:
      5:
        all:
          - layer_violations == 0
          - ports_layer_present == true

      3:
        all:
          - layer_violations <= 5
          - domain_violations == 0

      0:
        any:
          - layer_violations > 5
          - structure_classifiable == false
          - domain_violations > 0

  ARQ.002:
    name: "Aislamiento de Dependencias / SDK Específicos"
    confidence: 0.9

    metrics:
      - domain_leak
      - encapsulation_ratio
      - spread

    # Catalogo: integrations.exists(i, i.tech_class == 'VENDOR_SDK').
    # Si no hay SDK de proveedor el criterio es NOT_APPLICABLE y sale del denominador.
    applies_when:
      - vendor_sdk_integrations > 0

    scores:
      5:
        all:
          - domain_leak == 0
          - encapsulation_ratio >= 1.0
          - portability_class != "CLOUD_SPECIFIC"

      3:
        all:
          - domain_leak == 0
          - encapsulation_ratio >= 0.7

      0:
        any:
          - domain_leak > 0
          - encapsulation_ratio < 0.7
